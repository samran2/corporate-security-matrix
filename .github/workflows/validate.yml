name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate JavaScript syntax
        run: |
          node --check matrix-domains.js
          node --check matrix-actors.js
          node --check matrix-briefs.js
          node --check matrix-references.js
          node --check app.js
          node scripts/validate_data.mjs

      - name: Validate release surface
        run: python3 scripts/validate_project.py

      - name: Smoke-test static site
        shell: bash
        run: |
          python3 -m http.server 8010 --bind 127.0.0.1 >/tmp/corporate-security-matrix-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8010/index.html >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/corporate-security-matrix-http.log
              exit 1
            fi
            sleep 0.25
          done
          for path in index.html framework.html acknowledgements.html 404.html styles.css app.js matrix-domains.js matrix-actors.js matrix-briefs.js matrix-references.js robots.txt sitemap.xml assets/favicon.svg assets/apple-touch-icon.png assets/social-preview.png; do
            curl --fail --silent --show-error "http://127.0.0.1:8010/$path" >/dev/null
          done
