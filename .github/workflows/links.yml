name: External source links

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-source-links-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate external link checker security boundaries
        run: python3 scripts/test_validate_project_links.py

      - name: Verify authoritative sources and publish restricted-access report
        shell: bash
        run: |
          set +e
          csm_link_report="$RUNNER_TEMP/external-source-link-report.txt"
          python3 scripts/validate_project.py --check-links >"$csm_link_report" 2>&1
          validator_status=$?
          cat "$csm_link_report"
          {
            echo "## External source-link report"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo '```text'
            cat "$csm_link_report"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$validator_status"

      - name: Record exact external-link SHA
        if: always()
        shell: bash
        run: |
          {
            echo "## External source-link workflow SHA"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"
