name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate release
        run: |
          node --check app.js
          node scripts/validate_data.mjs
          python3 scripts/validate_project.py

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare static artifact
        shell: bash
        run: |
          mkdir _site
          cp index.html framework.html acknowledgements.html 404.html styles.css app.js matrix-domains.js matrix-actors.js matrix-briefs.js matrix-references.js robots.txt sitemap.xml .nojekyll SOURCE-LIBRARY.md FACT-CHECK.md FRAMEWORK.md SECURITY.md _site/
          cp -R assets _site/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify deployed pages
        run: |
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --silent --show-error --output /dev/null "${{ steps.deployment.outputs.page_url }}"
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --silent --show-error --output /dev/null "${{ steps.deployment.outputs.page_url }}framework.html"
