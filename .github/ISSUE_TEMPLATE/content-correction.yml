name: Content correction
description: Report a factual, source, scope or terminology issue
title: "[Content]: "
labels: [content]
body:
  - type: markdown
    attributes:
      value: "Thank you for helping improve the evidence base. Do not include sensitive operational information or personal data."
  - type: textarea
    id: location
    attributes:
      label: Location
      description: Identify the domain, lifecycle phase and exact text.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is incorrect or unclear?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Authoritative evidence
      description: Provide the original official source, edition or release status, jurisdiction or intended audience, and the scope that supports the correction.
      placeholder: "Source URL; title and edition; current status; where it applies; relevant section or page"
    validations:
      required: true
  - type: textarea
    id: applicability
    attributes:
      label: Applicability or limitation
      description: Note any sector, jurisdiction, legal, contractual or professional-competence boundary that should remain visible.
    validations:
      required: false
  - type: textarea
    id: proposal
    attributes:
      label: Suggested correction
    validations:
      required: false
